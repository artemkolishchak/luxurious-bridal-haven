<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Luxurious Bridal Haven">
  <link rel="manifest" href="favicon/site.webmanifest">
  <title>Luxurious Bridal Haven</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>

<body class="d-flex">
  <header class="header">
    <div class="header__inner d-flex">
      <div class="header__logo logo">
        <a class="logo__link" href="#">
          <img class="logo__image" src="images/Luxurious-Bridal-Haven-Logo.svg" width="242" height="51"
            alt="Luxurious Bridal Haven Logo">
        </a>
      </div>
      <ul class="header__switcher-langs d-flex">
        <li class="header__switcher-lang">
          <a class="header__switcher-lang-link header__switcher-lang-link--active" href="#"><span
              class="header__switcher-lang-code">En</span></a>
        </li>
        <li class="header__switcher-lang">
          <a class="header__switcher-lang-link" href="#">Ua</a>
        </li>
      </ul>
      <nav class="header__nav">
        <ul class="header__menu-list d-flex">
          <li class="header__menu-item">
            <a class="header__menu-item-link header__menu-item-link--active" href="#">Catalog</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-item-link" href="#">Collections</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-item-link" href="#">About</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-item-link" href="#">Book an Appointment</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-item-link" href="#">Contact</a>
          </li>
        </ul>
      </nav>
      <ul class="header__actions d-flex">
        <li class="header__actions-item header__actions-item--account">
          <a class="header__actions-item-link" href="#" aria-label="My Account">
            <svg width="24" height="24" role="img">
              <use href="images/sprite.svg#user-icon"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item header__actions-item--wishlist">
          <a class="header__actions-item-link" href="#" aria-label="Wishlist">
            <svg width="24" height="24" role="img">
              <use href="images/sprite.svg#wishlist-icon"></use>
            </svg>
          </a>
        </li>
        <li class="header__actions-item header__actions-item--cart">
          <a class="header__actions-item-link" href="#" aria-label="Shopping Cart">
            <svg width="24" height="24" role="img">
              <use href="images/sprite.svg#shopping-bag-icon"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </header>
